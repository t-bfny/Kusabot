name: Daily Watering Check

on:
    # GitHub Actionsのscheduleトリガーは負荷次第で数時間遅延するため使用しない。
    # 外部cronサービス(例: cron-job.org)から毎朝7:30 JSTにworkflow_dispatch APIを呼び出す運用にする。
    workflow_dispatch: # 手動実行用ボタン・外部cronからのAPI起動用

jobs:
    check-and-notify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: pip install slack_sdk

            - name: Run script
              env:
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
              run: python water_bot.py

            - name: Commit changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add plants.json
                  git diff --quiet && git diff --staged --quiet || (git commit -m "Update watering log" && git push)
